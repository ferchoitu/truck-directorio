# PostgreSQL tuning for a Hostinger KVM 1 (1 vCPU, 4 GB RAM, 50 GB NVMe) that
# also runs uvicorn and next start on the same box.
#
# Selected automatically by deploy/scripts/00-bootstrap.sh when the box has less
# than 6 GB of RAM. Moving to a KVM 2 later means swapping this for
# tuning-8gb.conf and restarting Postgres — nothing else changes.
#
# The binding constraint here is not the database, it is `next build`: on 4 GB
# the build peak and shared_buffers are competing for the same memory. Every
# number below is smaller than it "should" be for a 6 GB dataset, on purpose.

# ---- Memory -----------------------------------------------------------------
# 768 MB, not the 1 GB a 4 GB box would normally get. The build peak is worth
# more than the extra buffer pool: the dataset is ~6 GB either way, so it was
# never going to be cache-resident, and the kernel page cache does a better job
# with the leftovers than shared_buffers would.
shared_buffers = 768MB

# Deliberately conservative — Next.js and uvicorn are eating into the page
# cache that this number is supposed to describe. Overstating it makes the
# planner pick index scans that then miss.
effective_cache_size = 2GB

# Per sort/hash node. Lower than the 8 GB profile because a single vCPU means
# fewer concurrent queries but far less headroom if one goes wide.
work_mem = 16MB

# Raised to 1GB for the duration of the import by 10-migrate-from-railway.sh —
# the GIN builds over 2.2M carrier names are the one operation that genuinely
# needs it, and they run before any traffic exists.
maintenance_work_mem = 256MB

# ---- Storage ----------------------------------------------------------------
# NVMe: random reads cost essentially the same as sequential ones. The 4.0
# default is a spinning-disk assumption and pushes the planner away from the
# index scans this workload depends on.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- Write-ahead log --------------------------------------------------------
# Half the 8 GB profile: WAL lives on the same 50 GB disk as the database, the
# backups and the Next.js build output, and disk is genuinely tight here.
wal_compression = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# ---- Parallelism ------------------------------------------------------------
# One vCPU: parallel query is pure overhead, there is no second core to run the
# worker on. max_worker_processes still needs slack because autovacuum workers
# come out of the same pool, and on 15M rows of inspections and violations a
# stalled autovacuum means bloat and collapsing query plans.
max_worker_processes = 4
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
autovacuum_max_workers = 2

# ---- Connections ------------------------------------------------------------
# uvicorn runs a single worker on this box, so the connection pool is small.
# 50 × 16MB work_mem is already more than the machine has — this is a ceiling
# against runaway connections, not a target.
max_connections = 50
listen_addresses = 'localhost'

# ---- Logging ----------------------------------------------------------------
# There is no managed dashboard anymore, so log what would have been on it.
# The threshold is higher than the 8 GB profile because on one vCPU a 2s query
# under load is normal, not news.
log_min_duration_statement = 5000
log_checkpoints = on
log_autovacuum_min_duration = 10000
