# PostgreSQL tuning for a Hostinger KVM 2 (2 vCPU, 8 GB RAM, NVMe) that also
# runs uvicorn and next start on the same box.
#
# Installed to /etc/postgresql/<major>/main/conf.d/yotruck-tuning.conf by
# deploy/scripts/00-bootstrap.sh. Settings here override postgresql.conf.
#
# Workload shape: ~6 GB of FMCSA data, read-almost-only. Writes happen once a
# day (the census updater) and once a month (the SMS reingest). The expensive
# reads are the two GIN/pg_trgm indexes over 2.2M carrier names.

# ---- Memory -----------------------------------------------------------------
# 2 GB leaves ~6 GB for Next.js, uvicorn, the page cache and headroom. Going
# higher starves the page cache, which is what actually keeps the trgm indexes
# warm.
shared_buffers = 2GB

# Not an allocation — it tells the planner how much of the DB the kernel is
# likely caching, so it prefers index scans over sequential ones.
effective_cache_size = 5GB

# Per sort/hash node, not per connection. With max_connections at 100 the
# theoretical worst case is high, but this workload runs a handful of
# concurrent queries, all of them narrow lookups.
work_mem = 32MB

# Used by CREATE INDEX and VACUUM. The pg_restore in 10-migrate-from-railway.sh
# raises this for the session — rebuilding the GIN indexes is the slowest part
# of the import.
maintenance_work_mem = 512MB

# ---- Storage ----------------------------------------------------------------
# NVMe: random reads cost essentially the same as sequential ones. The 4.0
# default is a spinning-disk assumption and pushes the planner away from the
# index scans this workload depends on.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- Write-ahead log --------------------------------------------------------
# Sized for the bulk ingests. A small max_wal_size turns the monthly SMS load
# into a checkpoint storm.
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ---- Parallelism ------------------------------------------------------------
# 2 vCPU shared with the web tier: one parallel worker per gather, at most.
#
# max_worker_processes is the shared pool that autovacuum workers also draw
# from, so it cannot be set to the parallel budget alone — squeezing it to 2
# would leave autovacuum unable to launch, and on 15M rows of inspections and
# violations a stalled autovacuum turns into bloat and dying query plans.
# 6 = 2 parallel + 2 autovacuum + headroom.
max_worker_processes = 6
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
autovacuum_max_workers = 2

# ---- Connections ------------------------------------------------------------
# Only ever reached over the loopback interface by uvicorn and by cron.
max_connections = 100
listen_addresses = 'localhost'

# ---- Logging ----------------------------------------------------------------
# There is no managed dashboard anymore, so log what would have been on it.
log_min_duration_statement = 2000
log_checkpoints = on
log_autovacuum_min_duration = 10000
