# nginx front for yotruck.com
#
# Install to /etc/nginx/sites-available/yotruck and symlink into sites-enabled,
# then run `certbot --nginx -d yotruck.com -d www.yotruck.com`. Certbot upgrades
# this server block in place with the TLS directives and adds the :80 redirect,
# so the locations below survive untouched.
#
# Routing: everything under /api/ is the FastAPI backend, everything else is
# Next.js. Note that /api-access is a Next.js *page*, not an API route — the
# trailing slash in `location /api/` is what keeps them apart.

upstream yotruck_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream yotruck_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Generous per-IP ceiling. This is not the billing quota — /api/v1 meters by
# API key in the application. It exists so a single scraper cannot saturate the
# two vCPU that Postgres also needs.
limit_req_zone $binary_remote_addr zone=yotruck_api:10m rate=30r/s;

# Apex redirects to www: lib/site.ts hardcodes https://www.yotruck.com as the
# canonical origin, and serving both hosts is how the duplicate-canonical
# problem started the first time.
server {
    listen 80;
    listen [::]:80;
    server_name yotruck.com;
    return 301 https://www.yotruck.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.yotruck.com;

    # Paddle webhooks and API responses only; nothing here accepts uploads.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/xml
        application/json application/ld+json
        application/javascript image/svg+xml;

    access_log /var/log/nginx/yotruck.access.log;
    error_log  /var/log/nginx/yotruck.error.log;

    # ---- FastAPI ------------------------------------------------------------
    location /api/ {
        limit_req zone=yotruck_api burst=60 nodelay;

        proxy_pass http://yotruck_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The SMS safety endpoint joins across millions of inspection and
        # violation rows; 60s is the cold-cache worst case, not the norm.
        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
        proxy_send_timeout   60s;
    }

    # ---- Next.js static assets ---------------------------------------------
    # Content-hashed filenames. Next already serves these with
    # `Cache-Control: public, max-age=31536000, immutable`, so this block only
    # exists to skip the access log and the proxy timeouts below — deliberately
    # no add_header, which would emit a second Cache-Control alongside the
    # upstream one rather than replacing it.
    location /_next/static/ {
        proxy_pass http://yotruck_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Next.js ------------------------------------------------------------
    location / {
        proxy_pass http://yotruck_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An ISR miss on a carrier page has to hit the API and re-render before
        # anything is sent. Googlebot is the main visitor to those cold pages.
        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
        proxy_send_timeout   60s;
    }
}
